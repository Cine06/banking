<!-- ============================================================
     LIST ACCOUNTS MODAL
     ============================================================ -->
<div id="accountsModal"
  class="action-modal fixed inset-0 z-50 hidden opacity-0 transition-all duration-300 flex items-center justify-center p-4"
  style="background: rgba(11, 8, 25, 0.7); backdrop-filter: blur(8px);">

  <div
    class="relative w-full max-w-4xl max-h-[85vh] rounded-[28px] bg-white dark:bg-finvest-darkCard border border-purple-100 dark:border-purple-900/40 shadow-finvest-card overflow-hidden flex flex-col transform scale-95 transition-transform duration-300"
    id="accountsModalCard">

    <!-- Header -->
    <div
      class="flex items-center justify-between p-6 pb-4 border-b border-slate-100 dark:border-purple-900/40 bg-gradient-to-r from-slate-50/80 to-purple-50/50 dark:from-purple-950/30 dark:to-purple-900/20">
      <div class="flex items-center gap-3">
        <div
          class="w-10 h-10 rounded-xl bg-gradient-to-br from-finvest-purple to-[#4334C4] flex items-center justify-center text-white shadow-finvest-pill">
          <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z" />
          </svg>
        </div>
        <div>
          <h2 class="text-lg font-bold text-slate-900 dark:text-white">All Accounts</h2>
          <p class="text-xs text-slate-400 mt-0.5">View all registered banking accounts</p>
        </div>
      </div>

      <div class="flex items-center gap-2">
        <span id="accountsCountBadge"
          class="px-3 py-1 rounded-full text-[11px] font-bold bg-purple-100 dark:bg-purple-950 text-finvest-purple dark:text-purple-300">0
          accounts</span>
        <button id="btnCloseAccountsModal"
          class="w-8 h-8 rounded-full bg-slate-100 dark:bg-purple-950/60 hover:bg-rose-100 dark:hover:bg-rose-950/50 text-slate-500 dark:text-slate-400 hover:text-rose-600 dark:hover:text-rose-400 flex items-center justify-center transition"
          title="Close">
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
    </div>

    <!-- Search Bar -->
    <div class="px-6 py-3 border-b border-slate-100 dark:border-purple-900/30">
      <div
        class="flex items-center gap-2 bg-slate-50 dark:bg-purple-950/30 border border-slate-200 dark:border-purple-800/50 rounded-xl px-4 py-2.5 focus-within:ring-2 focus-within:ring-finvest-purple focus-within:border-finvest-purple transition">
        <svg class="w-4 h-4 text-slate-400 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor"
          stroke-width="2">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="text" id="accountsSearchInput"
          class="flex-1 bg-transparent text-sm text-slate-800 dark:text-slate-200 placeholder-slate-400 focus:outline-none"
          placeholder="Search by name, account number, or email..." autocomplete="off" />
      </div>
    </div>

    <!-- Accounts List Container -->
    <div class="flex-1 overflow-y-auto p-6 space-y-3" id="accountsListContainer">
      <!-- Loading skeleton shown initially -->
      <div id="accountsLoadingSkeleton" class="space-y-3">
        <div class="animate-pulse flex items-center gap-4 p-4 rounded-2xl bg-slate-50 dark:bg-purple-950/25">
          <div class="w-10 h-10 rounded-xl bg-slate-200 dark:bg-purple-900/50"></div>
          <div class="flex-1 space-y-2">
            <div class="h-3 w-32 bg-slate-200 dark:bg-purple-900/50 rounded"></div>
            <div class="h-2.5 w-48 bg-slate-200 dark:bg-purple-900/50 rounded"></div>
          </div>
          <div class="h-4 w-24 bg-slate-200 dark:bg-purple-900/50 rounded"></div>
        </div>
        <div class="animate-pulse flex items-center gap-4 p-4 rounded-2xl bg-slate-50 dark:bg-purple-950/25">
          <div class="w-10 h-10 rounded-xl bg-slate-200 dark:bg-purple-900/50"></div>
          <div class="flex-1 space-y-2">
            <div class="h-3 w-28 bg-slate-200 dark:bg-purple-900/50 rounded"></div>
            <div class="h-2.5 w-44 bg-slate-200 dark:bg-purple-900/50 rounded"></div>
          </div>
          <div class="h-4 w-20 bg-slate-200 dark:bg-purple-900/50 rounded"></div>
        </div>
        <div class="animate-pulse flex items-center gap-4 p-4 rounded-2xl bg-slate-50 dark:bg-purple-950/25">
          <div class="w-10 h-10 rounded-xl bg-slate-200 dark:bg-purple-900/50"></div>
          <div class="flex-1 space-y-2">
            <div class="h-3 w-36 bg-slate-200 dark:bg-purple-900/50 rounded"></div>
            <div class="h-2.5 w-40 bg-slate-200 dark:bg-purple-900/50 rounded"></div>
          </div>
          <div class="h-4 w-28 bg-slate-200 dark:bg-purple-900/50 rounded"></div>
        </div>
      </div>

      <!-- Actual accounts list rendered by JS -->
      <div id="accountsListContent" class="hidden space-y-3"></div>
    </div>

  </div>
</div>

<!-- ============================================================
     AUTHENTICATION MODAL
     ============================================================ -->
<div id="authModal"
  class="fixed inset-0 z-[100] flex items-center justify-center p-4 sm:p-6 overflow-y-auto hidden opacity-0 transition-all duration-300">

  <!-- Backdrop with ambient glow -->
  <div class="fixed inset-0 bg-[#0E0B1F]/80 backdrop-blur-xl transition-opacity" onclick="app.closeAuthModal()"></div>
  <div class="fixed top-10 left-1/4 w-96 h-96 bg-finvest-purple/35 rounded-full blur-[120px] pointer-events-none">
  </div>

  <!-- Glassmorphic Card Container -->
  <div
    class="relative w-full max-w-md my-auto glass-auth-card rounded-[28px] p-6 sm:p-8 text-white shadow-glass border border-white/20 z-10 transform scale-95 transition-all duration-300">

    <!-- Close Button -->
    <button id="btnCloseAuth"
      class="absolute top-5 right-5 w-8 h-8 rounded-full bg-white/10 hover:bg-white/20 flex items-center justify-center text-white/80 transition">
      <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
      </svg>
    </button>

    <!-- Auth Switch Tabs -->
    <div class="text-center mb-6">
      <h2 id="authModalTitle" class="text-2xl font-extrabold tracking-tight">Sign In</h2>
      <p id="authModalSubtitle" class="text-xs text-purple-200/80 mt-1">Access your secure Nevaeh Banking account</p>
    </div>

    <!-- Tab Buttons: Login / Sign Up -->
    <div class="flex p-1 bg-white/10 rounded-2xl mb-6 backdrop-blur-md border border-white/15">
      <button id="tabLogin"
        class="flex-1 py-2 text-xs font-bold rounded-xl transition-all duration-200 bg-gradient-to-r from-[#6355EC] to-[#4334C4] text-white shadow-sm">
        Sign In
      </button>
      <button id="tabRegister"
        class="flex-1 py-2 text-xs font-bold rounded-xl transition-all duration-200 text-white/80 hover:text-white">
        Create Account
      </button>
    </div>

    <!-- ---------------- LOGIN FORM ---------------- -->
    <form id="authLoginForm" class="space-y-4" novalidate>
      <div>
        <label class="block text-xs font-semibold text-white uppercase tracking-wider mb-1.5">Username or
          Email</label>
        <input type="text" id="loginUsername"
          class="w-full px-4 py-3 bg-white/15 border border-white/25 rounded-xl text-white placeholder-purple-200/60 text-sm focus:outline-none focus:ring-2 focus:ring-purple-400"
          placeholder="Enter username or email" required />
        <div id="loginUsernameError" class="text-xs text-rose-300 font-medium mt-1 hidden"></div>
      </div>

      <div>
        <label class="block text-xs font-semibold text-white uppercase tracking-wider mb-1.5">Password</label>
        <div class="relative">
          <input type="password" id="loginPassword"
            class="w-full px-4 py-3 bg-white/15 border border-white/25 rounded-xl text-white placeholder-purple-200/60 text-sm focus:outline-none focus:ring-2 focus:ring-purple-400 pr-10"
            placeholder="Enter password" required />
          <button type="button"
            class="btn-toggle-pwd absolute inset-y-0 right-0 pr-3.5 flex items-center text-purple-200 hover:text-white"
            data-target="loginPassword">
            <svg class="w-4 h-4 icon-eye-open" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
            </svg>
          </button>
        </div>
        <div id="loginPasswordError" class="text-xs text-rose-300 font-medium mt-1 hidden"></div>
      </div>

      <button type="submit" id="btnLoginSubmit"
        class="w-full py-3.5 rounded-full bg-gradient-to-r from-[#6355EC] via-[#5344DC] to-[#4334C4] text-white font-bold text-sm hover:from-[#5344DC] hover:to-[#3225A6] active:scale-95 shadow-lg shadow-purple-500/30 transition-all mt-2">
        Sign In
      </button>

      <p class="text-center text-xs text-purple-200/80 pt-2">
        Don't have an account? <button type="button" id="linkToRegister"
          class="text-white font-bold underline hover:text-purple-200">Sign Up</button>
      </p>
    </form>

    <!-- ---------------- SIGN UP FORM ---------------- -->
    <form id="authRegisterForm" class="space-y-3.5 hidden" novalidate>
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-[11px] font-semibold text-white uppercase tracking-wider mb-1">First
            Name</label>
          <input type="text" id="regFirstName"
            class="w-full px-3.5 py-2.5 bg-white/15 border border-white/25 rounded-xl text-white placeholder-purple-200/60 text-xs focus:outline-none focus:ring-2 focus:ring-purple-400"
            placeholder="e.g. Jon" required />
          <div id="regFirstNameError" class="text-[10px] text-rose-300 mt-0.5 hidden"></div>
        </div>
        <div>
          <label class="block text-[11px] font-semibold text-white uppercase tracking-wider mb-1">Last
            Name</label>
          <input type="text" id="regLastName"
            class="w-full px-3.5 py-2.5 bg-white/15 border border-white/25 rounded-xl text-white placeholder-purple-200/60 text-xs focus:outline-none focus:ring-2 focus:ring-purple-400"
            placeholder="e.g. Snow" required />
          <div id="regLastNameError" class="text-[10px] text-rose-300 mt-0.5 hidden"></div>
        </div>
      </div>

      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-[11px] font-semibold text-white uppercase tracking-wider mb-1">Middle Name
            (Opt)</label>
          <input type="text" id="regMiddleName"
            class="w-full px-3.5 py-2.5 bg-white/15 border border-white/25 rounded-xl text-white placeholder-purple-200/60 text-xs focus:outline-none"
            placeholder="Optional" />
        </div>
        <div>
          <label class="block text-[11px] font-semibold text-white uppercase tracking-wider mb-1">Username</label>
          <input type="text" id="regUsername"
            class="w-full px-3.5 py-2.5 bg-white/15 border border-white/25 rounded-xl text-white placeholder-purple-200/60 text-xs focus:outline-none focus:ring-2 focus:ring-purple-400"
            placeholder="e.g. jon@123" required />
          <div id="regUsernameError" class="text-[10px] text-rose-300 mt-0.5 hidden"></div>
        </div>
      </div>

      <div>
        <label class="block text-[11px] font-semibold text-white uppercase tracking-wider mb-1">Email
          Address</label>
        <input type="email" id="regEmail"
          class="w-full px-3.5 py-2.5 bg-white/15 border border-white/25 rounded-xl text-white placeholder-purple-200/60 text-xs focus:outline-none focus:ring-2 focus:ring-purple-400"
          placeholder="jon.snow@example.com" required />
        <div id="regEmailError" class="text-[10px] text-rose-300 mt-0.5 hidden"></div>
      </div>

      <div>
        <label class="block text-[11px] font-semibold text-white uppercase tracking-wider mb-1">Password</label>
        <input type="password" id="regPassword"
          class="w-full px-3.5 py-2.5 bg-white/15 border border-white/25 rounded-xl text-white placeholder-purple-200/60 text-xs focus:outline-none focus:ring-2 focus:ring-purple-400"
          placeholder="2-12 chars (numbers & special char)" required />
        <div id="regPasswordError" class="text-[10px] text-rose-300 mt-0.5 hidden"></div>
      </div>

      <button type="submit" id="btnRegisterSubmit"
        class="w-full py-3.5 rounded-full bg-gradient-to-r from-[#6355EC] via-[#5344DC] to-[#4334C4] text-white font-bold text-xs hover:from-[#5344DC] hover:to-[#3225A6] active:scale-95 shadow-lg shadow-purple-500/30 transition-all mt-2">
        Create Account
      </button>

      <p class="text-center text-xs text-purple-200/80 pt-1">
        Already registered? <button type="button" id="linkToLogin"
          class="text-white font-bold underline hover:text-purple-200">Log In</button>
      </p>
    </form>

  </div>
</div>

<!-- ============================================================
     CHANGE PASSWORD MODAL
     ============================================================ -->
<div id="changePasswordModal"
  class="action-modal fixed inset-0 z-[100] flex items-center justify-center p-4 sm:p-6 hidden opacity-0 transition-all duration-300"
  style="background: rgba(11, 8, 25, 0.7); backdrop-filter: blur(8px);">

  <!-- Ambient glow -->
  <div class="fixed top-1/3 right-1/4 w-72 h-72 bg-finvest-purple/25 rounded-full blur-[100px] pointer-events-none">
  </div>

  <div
    class="relative w-full max-w-md glass-auth-card rounded-[28px] p-6 sm:p-8 text-white shadow-glass border border-white/20 z-10 transform scale-95 transition-all duration-300"
    id="changePasswordCard">

    <!-- Close Button -->
    <button id="btnCloseChangePassword"
      class="absolute top-5 right-5 w-8 h-8 rounded-full bg-white/10 hover:bg-white/20 flex items-center justify-center text-white/80 transition">
      <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
      </svg>
    </button>

    <!-- Header -->
    <div class="text-center mb-6">
      <div
        class="w-14 h-14 mx-auto mb-3 rounded-2xl bg-gradient-to-br from-finvest-purple to-[#4334C4] flex items-center justify-center shadow-finvest-pill">
        <svg class="w-7 h-7 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
        </svg>
      </div>
      <h2 class="text-xl font-extrabold tracking-tight">Change Password</h2>
      <p class="text-xs text-purple-200/80 mt-1">Update your account security credentials</p>
    </div>

    <!-- Change Password Form -->
    <form id="changePasswordForm" class="space-y-4" novalidate>

      <!-- Current Password -->
      <div>
        <label class="block text-xs font-semibold text-white uppercase tracking-wider mb-1.5">Current
          Password</label>
        <div class="relative">
          <input type="password" id="cpCurrentPassword"
            class="w-full px-4 py-3 bg-white/15 border border-white/25 rounded-xl text-white placeholder-purple-200/60 text-sm focus:outline-none focus:ring-2 focus:ring-purple-400 pr-10"
            placeholder="Enter current password" required />
          <button type="button"
            class="btn-toggle-pwd absolute inset-y-0 right-0 pr-3.5 flex items-center text-purple-200 hover:text-white"
            data-target="cpCurrentPassword">
            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
            </svg>
          </button>
        </div>
        <div id="cpCurrentPasswordError" class="text-xs text-rose-300 font-medium mt-1 hidden"></div>
      </div>

      <!-- Divider -->
      <div class="flex items-center gap-3 py-1">
        <div class="flex-1 h-px bg-white/15"></div>
        <span class="text-[10px] font-bold text-purple-200/60 uppercase tracking-widest">New Credentials</span>
        <div class="flex-1 h-px bg-white/15"></div>
      </div>

      <!-- New Password -->
      <div>
        <label class="block text-xs font-semibold text-white uppercase tracking-wider mb-1.5">New Password</label>
        <div class="relative">
          <input type="password" id="cpNewPassword"
            class="w-full px-4 py-3 bg-white/15 border border-white/25 rounded-xl text-white placeholder-purple-200/60 text-sm focus:outline-none focus:ring-2 focus:ring-purple-400 pr-10"
            placeholder="2-12 chars (numbers & special char)" required />
          <button type="button"
            class="btn-toggle-pwd absolute inset-y-0 right-0 pr-3.5 flex items-center text-purple-200 hover:text-white"
            data-target="cpNewPassword">
            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
            </svg>
          </button>
        </div>
        <div id="cpNewPasswordError" class="text-xs text-rose-300 font-medium mt-1 hidden"></div>
        <!-- Password strength indicator -->
        <div class="mt-2 space-y-1.5" id="cpPasswordStrengthContainer">
          <div class="flex gap-1">
            <div class="h-1 flex-1 rounded-full bg-white/15 overflow-hidden">
              <div id="cpStrengthBar1" class="h-full w-0 rounded-full transition-all duration-300"></div>
            </div>
            <div class="h-1 flex-1 rounded-full bg-white/15 overflow-hidden">
              <div id="cpStrengthBar2" class="h-full w-0 rounded-full transition-all duration-300"></div>
            </div>
            <div class="h-1 flex-1 rounded-full bg-white/15 overflow-hidden">
              <div id="cpStrengthBar3" class="h-full w-0 rounded-full transition-all duration-300"></div>
            </div>
            <div class="h-1 flex-1 rounded-full bg-white/15 overflow-hidden">
              <div id="cpStrengthBar4" class="h-full w-0 rounded-full transition-all duration-300"></div>
            </div>
          </div>
          <p id="cpStrengthLabel" class="text-[10px] font-bold text-purple-200/60 uppercase tracking-wider"></p>
        </div>
      </div>

      <!-- Confirm New Password -->
      <div>
        <label class="block text-xs font-semibold text-white uppercase tracking-wider mb-1.5">Confirm New
          Password</label>
        <div class="relative">
          <input type="password" id="cpConfirmPassword"
            class="w-full px-4 py-3 bg-white/15 border border-white/25 rounded-xl text-white placeholder-purple-200/60 text-sm focus:outline-none focus:ring-2 focus:ring-purple-400 pr-10"
            placeholder="Re-enter new password" required />
          <button type="button"
            class="btn-toggle-pwd absolute inset-y-0 right-0 pr-3.5 flex items-center text-purple-200 hover:text-white"
            data-target="cpConfirmPassword">
            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
            </svg>
          </button>
        </div>
        <div id="cpConfirmPasswordError" class="text-xs text-rose-300 font-medium mt-1 hidden"></div>
      </div>

      <!-- Submit Button -->
      <button type="submit" id="btnChangePasswordSubmit"
        class="w-full py-3.5 rounded-full bg-gradient-to-r from-[#6355EC] via-[#5344DC] to-[#4334C4] text-white font-bold text-sm hover:from-[#5344DC] hover:to-[#3225A6] active:scale-95 shadow-lg shadow-purple-500/30 transition-all mt-2">
        Update Password
      </button>

      <!-- Security Note -->
      <div class="flex items-start gap-2 p-3 rounded-xl bg-white/5 border border-white/10 mt-2">
        <svg class="w-4 h-4 text-amber-300 mt-0.5 flex-shrink-0" fill="none" viewBox="0 0 24 24"
          stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-2.5L13.732 4c-.77-.833-1.964-.833-2.732 0L4.082 16.5c-.77.833.192 2.5 1.732 2.5z" />
        </svg>
        <p class="text-[10px] text-purple-200/70 leading-relaxed">
          Password must be 2–12 characters and contain at least one number and one special character. You'll remain
          signed in after changing.
        </p>
      </div>
    </form>

  </div>
</div>
